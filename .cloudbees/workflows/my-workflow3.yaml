apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  workflow_dispatch:
    inputs:
      manifest:
        type: string
        required: true
        description: This is a system-generated parameter and it is required for use in application releases. Refer to https://docs.cloudbees.com/docs/cloudbees-platform/latest/applications/releases#manifest for the expected format
metadata:
  stages/v1alpha1:
    - name: hackersapp-may-qa
      jobs:
        - hackersapp-may-qa
    - name: hackersapp-may-staging
      jobs:
        - hackersapp-may-staging
    - name: hackersapp-may-prod
      jobs:
        - hackersapp-may-prod
    - name: DR2
      jobs:
        - job
jobs:
  hackersapp-may-qa:
    environment: hackersapp-may-qa
    uses: ./.cloudbees/workflows/deployer.yaml
    with:
      manifest: ${{ inputs.manifest }}
      environment: ${{ job.environment }}
  hackersapp-may-staging:
    needs: hackersapp-may-qa
    environment: hackersapp-may-staging
    uses: ./.cloudbees/workflows/deployer.yaml
    with:
      manifest: ${{ inputs.manifest }}
      environment: ${{ job.environment }}
  hackersapp-may-prod:
    needs: hackersapp-may-staging
    environment: hackersapp-may-prod
    uses: ./.cloudbees/workflows/deployer.yaml
    with:
      manifest: ${{ inputs.manifest }}
      environment: ${{ job.environment }}
  job:
    needs:
      - hackersapp-may-prod
    steps:
      - name: Say hello
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: echo "hello world"
